<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Config — Chat Watcher</title>
  <script src="/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = window.tailwindConfig</script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div id="navbar-mount"></div>

  <main class="max-w-2xl mx-auto px-6 py-8">

    <!-- Page header -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white">Global Spike Config</h1>
      <p class="text-gray-500 text-sm mt-1">Default thresholds applied to all streams unless overridden per-stream.</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
      <div class="flex items-center gap-2 px-6 py-4 border-b border-gray-800">
        <span class="text-base">⚙️</span>
        <h2 class="text-sm font-semibold text-white">Detection Thresholds</h2>
      </div>
      <div class="p-6">
        <div id="global-config-form"></div>
        <p id="cfg-error"   class="text-red-400   text-sm mt-4 hidden"></p>
        <p id="cfg-success" class="text-green-400 text-sm mt-4 hidden">✓ Config saved successfully.</p>
        <div class="flex justify-end mt-8 pt-6 border-t border-gray-800">
          <button onclick="saveGlobalConfig()"
                  class="inline-flex items-center gap-2 text-sm font-medium px-6 py-2.5 rounded-xl transition-all text-white"
                  style="background:#0ea5e9; box-shadow: 0 0 20px #0ea5e933;">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Save Config
          </button>
        </div>
      </div>
    </div>

  </main>

  <div id="toast" class="hidden"></div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/config.js"></script>
</body>
</html>
