<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — Chat Watcher</title>
  <script src="/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = window.tailwindConfig</script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div id="navbar-mount"></div>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Back link -->
    <a href="/" class="inline-flex items-center gap-1.5 text-gray-500 text-sm hover:text-gray-300 transition-colors mb-6">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Dashboard
    </a>

    <!-- Page header — updated dynamically -->
    <div class="mb-8">
      <h1 id="page-title" class="text-2xl font-bold text-white">Loading…</h1>
      <p id="page-subtitle" class="text-gray-500 text-sm mt-1"></p>
    </div>

    <!-- Stat cards -->
    <div id="stats-row" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

    <!-- Results table card -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
        <div class="flex items-center gap-2">
          <span class="text-base">🔥</span>
          <h2 class="text-sm font-semibold text-white">Spike Timestamps</h2>
          <span class="text-xs text-gray-500 ml-1">— clip these moments</span>
        </div>
        <div class="flex items-center gap-3">
          <button id="summarize-all-btn"
                  onclick="triggerSummarizeAll(this)"
                  class="hidden inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg transition-all"
                  style="color:#818cf8; border:1px solid rgba(129,140,248,0.25); background:rgba(129,140,248,0.06);">
            🔍 Summarize All
          </button>
          <span class="text-xs text-gray-600">Sorted by stream time</span>
        </div>
      </div>
      <div class="overflow-x-auto" id="results-table"></div>
    </div>

  </main>

  <div id="toast" class="hidden"></div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/results.js"></script>
</body>
</html>
