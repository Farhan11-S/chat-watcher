<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Watcher</title>
  <script src="/js/tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = window.tailwindConfig</script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <div id="navbar-mount"></div>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Page header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">Dashboard</h1>
        <p class="text-gray-500 text-sm mt-1" id="page-subtitle">—</p>
      </div>
      <button onclick="loadSummary()" class="btn-ghost flex items-center gap-2 text-xs border border-gray-800 rounded-lg px-3 py-2 hover:border-gray-600">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Refresh
      </button>
    </div>

    <!-- Stat cards -->
    <div id="stats-row" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

    <!-- Summary table card -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">

      <!-- Card header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
        <div class="flex items-center gap-2">
          <span class="text-base">📋</span>
          <h2 class="text-sm font-semibold text-white">Stream Summary</h2>
          <span id="stream-count-badge" class="hidden ml-1 bg-gray-800 text-gray-400 text-xs font-medium px-2 py-0.5 rounded-full"></span>
        </div>
        <a href="/streams.html" class="text-xs text-brand-500 hover:text-brand-400 transition-colors">
          Manage streams →
        </a>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto" id="summary-table"></div>

    </div>
  </main>

  <div id="toast" class="hidden"></div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
