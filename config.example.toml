# Copy to config.toml and edit. Every key is optional; these are the defaults.
# Relative paths are resolved from this file's folder.

[general]
timezone = ""          # e.g. "Asia/Jakarta" (WIB) for every time shown and folder dates;
                       # empty = this computer's time zone

[paths]
data_dir = "data"      # database, raw chat, captions, heatmap
output_dir = "output"  # clips, storyboards, digests

[youtube]
ytdlp_path = "yt-dlp"
cookies_file = ""      # cookies.txt export; recommended (bot checks, members-only)
po_token = ""
deno_path = ""         # empty = look for deno on PATH
caption_langs = ["ja", "en"]   # fallback order when the original-language track is unknown
extra_args = []                # extra yt-dlp flags, e.g. ["--proxy", "socks5://..."]

[discover]
poll_minutes = 30              # how often the worker checks each channel's Streams tab
streams_per_check = 15
min_duration_s = 600           # ignore streams shorter than 10 minutes
default_backfill = 1           # finished streams to queue when you add a channel

[pipeline]
auto_clip = true               # false: stop after finding moments; you Keep/Skip them, then press "Clip kept"
auto_analyze = true
clip_top = 0                   # clip the best N moments (0 = all scored)
analyze_top = 0                # Claude-analyse the best N moments (0 = all)
preview_height = 360           # moments not downloaded yet get a video-only preview at this height;
                               # only its frames are kept, for Claude (0 = analyse downloaded clips only)

[scoring]
bin_seconds = 5
top_n = 10
min_score = 1.0               # weighted mean of √z; top moments are usually 1.2–2.5
merge_gap_s = 45
pre_roll_s = 25
post_roll_s = 5
min_clip_s = 20
max_clip_s = 180
default_stream_type = "auto"   # auto | talk | gaming | karaoke
react_window_s = 15            # chat reactions are summed over this window
baseline_window_s = 600        # "normal" chat level = rolling median over this window
feature_cap = 64.0             # z is capped before the square root
edge_ignore_s = 60             # no moments in the first/last N seconds
weights = {}                   # per-type overrides, e.g. { talk = { laugh = 3.0 } }
extra_keywords = {}            # e.g. { laugh = [":_mywarai:"] } for channel emotes

[clip]
format = "bv*+ba[ext=m4a]/bv*+ba/b"   # best video + AAC audio, never re-encoded
sort = "res,fps,br"            # highest resolution, then fps, then bitrate
merge_output_format = "mp4/mkv"
max_concurrent = 2
frames_per_clip = 8

[edit]                         # the dashboard editor's "Render edit"
crf = 18                       # x264 quality: lower = better and bigger; 17-20 looks lossless
preset = "veryfast"            # x264 speed: ultrafast … veryslow (slower = smaller file, same look)
audio_bitrate = "192k"
loudness_lufs = -14.0          # YouTube plays at -14 LUFS; 0 = leave the loudness as is
fade_ms = 30                   # tiny audio fade at every cut so cuts don't click
snap_s = 1.5                   # how far Claude's cut points may move to land in a pause

[transcribe]                   # Whisper speech to text on each downloaded clip (pip install faster-whisper)
enabled = true
auto = true                    # after each clip downloads; false = only the editor's 🎙 button
model = "large-v3-turbo"       # or "small": about a third faster, more misheard words
language = ""                  # "" = detect per line (mixed English/Indonesian is fine); or "en", "id", "ja"
threads = 0                    # CPU threads; 0 = all

[subtitles]                    # burned into the editor's render, from Whisper's word timings
on = true                      # for new edits (karaoke clips start off); each edit has its own switch
size = "normal"                # small | normal | large
position = "bottom"            # bottom | top
font = "Noto Sans CJK JP"      # any installed font; this one also has Japanese

[claude]
enabled = true
cli_path = "claude"            # uses your Claude subscription login (`claude auth login`); never --bare
model = "opus"                 # default for every clip; the dashboard can redo one with "sonnet" etc.
effort = "medium"              # low | medium | high | xhigh | max (more = deeper, uses more of your plan)
redo_model = "opus"            # what "Analyse again" on one moment picks first
redo_effort = "medium"
edit_model = "opus"            # the editor's ✨ Suggest effects and subtitle ✨ Clean up
edit_effort = "high"
moment_cap = 50                # max moment analyses in any 5 hours (0 = no cap); extra clips
moment_cap_hours = 5           # wait until the oldest one in the window is older than this
timeout_s = 600
output_language = "English"    # summaries, storyboards, caption translations
title_languages = ["ja", "en"]
allow_api_key = false          # keep false: ANTHROPIC_API_KEY would bill the API instead

[drive]
enabled = false                # turn on after `rclone config` has a Google Drive remote
rclone_path = "rclone"
remote = "gdrive"              # remote name from `rclone config`
folder = "chat-watcher"        # Drive folder; mirrors output/<channel>/<stream>/
auto_upload = true             # upload each stream when processing finishes
transfers = 4
login_expires_days = 0         # 7 if your Google app is in "Testing" (sign-in lasts a week)

[web]
host = "127.0.0.1"
port = 8000
